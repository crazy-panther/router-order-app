  <div class="track-orders-container">
    <mat-card>
      <mat-card-header>
        <mat-card-title>Track Orders</mat-card-title>
      </mat-card-header>

      <mat-card-content>
        <!-- Search and Filter Section -->
        <div class="search-filter-section">
          <mat-form-field appearance="outline">
            <mat-label>Search Orders</mat-label>
            <input matInput [(ngModel)]="searchTerm" (keyup)="applyFilter()" placeholder="Search by customer name, order ID or product">
            <mat-icon matSuffix>search</mat-icon>
          </mat-form-field>
        </div>

        <!-- Action Buttons -->
        <div class="action-buttons" *ngIf="selectedOrderIds.size > 0">
          <button mat-raised-button color="primary" (click)="viewBill()" [disabled]="selectedOrderIds.size !== 1">
            <mat-icon>receipt</mat-icon>
            View Bill
          </button>
          <button mat-raised-button color="accent" (click)="goToPrint()">
            <mat-icon>print</mat-icon>
            Print Selected
          </button>
        </div>

        <!-- Orders Table -->
        <table mat-table [dataSource]="filteredOrders" class="orders-table">
          <!-- Checkbox Column -->
          <ng-container matColumnDef="select">
            <th mat-header-cell *matHeaderCellDef>
              <mat-checkbox
                (change)="toggleAllSelection($event.checked)"
                [checked]="allSelected()"
                [indeterminate]="someSelected()">
              </mat-checkbox>
            </th>
            <td mat-cell *matCellDef="let order">
              <mat-checkbox
                (click)="$event.stopPropagation()"
                (change)="toggleSelection(order.orderId!, $event.checked)"
                [checked]="isSelected(order.orderId!)">
              </mat-checkbox>
            </td>
          </ng-container>

          <!-- Order ID Column -->
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef>Order ID</th>
            <td mat-cell *matCellDef="let order">{{order.orderId}}</td>
          </ng-container>

          <!-- Customer Column -->
          <ng-container matColumnDef="customer">
            <th mat-header-cell *matHeaderCellDef>Customer</th>
            <td mat-cell *matCellDef="let order">{{order.customer?.customerName}}</td>
          </ng-container>

          <!-- Router Column -->
          <ng-container matColumnDef="router">
            <th mat-header-cell *matHeaderCellDef>Router</th>
            <td mat-cell *matCellDef="let order">
              <div class="router-info">
                <span class="router-name">{{ order.router?.routerName }}</span>
                <span class="product-name">{{ order.orderItem?.productName }}</span>
              </div>
            </td>
          </ng-container>

          <!-- Price Column -->
          <ng-container matColumnDef="price">
            <th mat-header-cell *matHeaderCellDef>Price</th>
            <td mat-cell *matCellDef="let order">{{order.totalAmount | currency}}</td>
          </ng-container>

          <!-- Status Column -->
          <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef>Status</th>
            <td mat-cell *matCellDef="let order">
              <mat-form-field>
                <mat-select [value]="order.status" (selectionChange)="updateOrderStatus(order.orderId!, $event.value)">
                  <mat-option *ngFor="let status of statusOptions" [value]="status.value">
                    {{status.viewValue}}
                  </mat-option>
                </mat-select>
              </mat-form-field>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>

        <!-- No Data Message -->
        <div class="no-data-message" *ngIf="filteredOrders.length === 0">
          <p>No orders found</p>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
