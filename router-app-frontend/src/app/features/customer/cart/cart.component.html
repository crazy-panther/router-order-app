<mat-toolbar color="primary">
  <span>Your Router Order</span>
  <span class="spacer"></span>
  <button mat-button routerLink="/customer">
    <mat-icon>arrow_back</mat-icon> Back to Router
  </button>
</mat-toolbar>

<div class="cart-container">
  <mat-card *ngIf="cartItem; else emptyCart">
    <mat-card-header>
      <mat-card-title>{{ cartItem.productName }}</mat-card-title>
    </mat-card-header>
    
    <mat-card-content>
      <p><strong>Quantity:</strong> {{ cartItem.quantity }}</p>
      <p><strong>Total:</strong> Rs. {{ cartItem.totalAmount | number }}</p>
    </mat-card-content>
    
    <mat-card-actions class="actions">
      <button mat-raised-button color="warn" (click)="removeItem()">
        <mat-icon>delete</mat-icon> Remove Router
      </button>
      
      <button mat-raised-button color="primary" (click)="confirmOrder()">
        <mat-icon>check_circle</mat-icon> Confirm Order
      </button>
    </mat-card-actions>
  </mat-card>

  <ng-template #emptyCart>
    <mat-card class="empty-cart">
      <mat-card-content>
        <mat-icon class="empty-icon">remove_shopping_cart</mat-icon>
        <h3>Your cart is empty</h3>
        <p>You haven't added any router to your cart yet</p>
      </mat-card-content>
      <mat-card-actions>
        <button mat-raised-button color="primary" routerLink="/customer">
          <mat-icon>wifi</mat-icon> Browse Routers
        </button>
      </mat-card-actions>
    </mat-card>
  </ng-template>
</div>
