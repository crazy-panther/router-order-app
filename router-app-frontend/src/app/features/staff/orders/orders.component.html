<div class="orders-container">
    <mat-card class="orders-card">
        <mat-card-header>
            <mat-card-title>Orders Management</mat-card-title>
        </mat-card-header>
        
        <mat-card-content>
            <div class="toolbar">
                <mat-form-field appearance="outline" class="search-field">
                    <mat-label>Search Orders</mat-label>
                    <input matInput [(ngModel)]="searchTerm" placeholder="Search by ID or Product Name" />
                </mat-form-field>
            </div>
            
            <div class="table-container">
                <table mat-table [dataSource]="filteredOrders" class="mat-elevation-z8 orders-table">
                    <!-- Order ID Column -->
                    <ng-container matColumnDef="orderId">
                        <th mat-header-cell *matHeaderCellDef> Order ID </th>
                        <td mat-cell *matCellDef="let order" class="id-cell"> {{ order.orderId }} </td>
                    </ng-container>
                
                    <!-- Product Name Column -->
                    <ng-container matColumnDef="productName">
                        <th mat-header-cell *matHeaderCellDef> Product Name </th>
                        <td mat-cell *matCellDef="let order" class="name-cell"> {{ order.orderItem.productName }} </td>
                    </ng-container>

                    <!-- Quantity Column -->
                    <ng-container matColumnDef="quantity">
                        <th mat-header-cell *matHeaderCellDef> Quantity </th>
                        <td mat-cell *matCellDef="let order" class="quantity-cell"> {{ order.orderItem.quantity }} </td>
                    </ng-container>
                
                    <!-- Total Amount Column -->
                    <ng-container matColumnDef="totalAmount">
                        <th mat-header-cell *matHeaderCellDef> Total Amount </th>
                        <td mat-cell *matCellDef="let order" class="price-cell"> Rs. {{ order.totalAmount | number }} </td>
                    </ng-container>
                
                    <!-- Status Column -->
                    <ng-container matColumnDef="status">
                        <th mat-header-cell *matHeaderCellDef> Status </th>
                        <td mat-cell *matCellDef="let order">
                            <mat-chip-listbox>
                                <mat-chip [class]="'status-' + order.status.toLowerCase()">
                                    {{ order.status }}
                                </mat-chip>
                            </mat-chip-listbox>
                        </td>
                    </ng-container>
                
                    <!-- Actions Column -->
                    <ng-container matColumnDef="actions">
                        <th mat-header-cell *matHeaderCellDef class="actions-header"> Actions </th>
                        <td mat-cell *matCellDef="let order" class="actions-cell">
                            <button mat-raised-button color="primary" (click)="acceptOrder(order)" class="action-button" *ngIf="order.status === 'PENDING'">
                                <mat-icon>check_circle</mat-icon> Accept
                            </button>
                            <button mat-raised-button color="warn" (click)="rejectOrder(order)" class="action-button" *ngIf="order.status === 'PENDING'">
                                <mat-icon>cancel</mat-icon> Reject
                            </button>
                        </td>
                    </ng-container>
                
                    <tr mat-header-row *matHeaderRowDef="['orderId', 'productName', 'quantity', 'totalAmount', 'status', 'actions']"></tr>
                    <tr mat-row *matRowDef="let row; columns: ['orderId', 'productName', 'quantity', 'totalAmount', 'status', 'actions'];"></tr>
                </table>
            </div>
        </mat-card-content>
    </mat-card>    
</div>
